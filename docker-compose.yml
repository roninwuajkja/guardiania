services:
  postgres:
    image: postgres:16-alpine
    container_name: guardiania-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: guardiania
      POSTGRES_USER: guardiania
      POSTGRES_PASSWORD: guardiania_dev
    ports:
      - "5432:5432"
    volumes:
      - guardiania_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardiania -d guardiania"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  guardiania_pg:
